name: Run Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  gut-tests:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tooling
        run: |
          python3 -m pip install --upgrade pip
          make install-dev

      - name: Static checks
        run: make static-check
        timeout-minutes: 3

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Type check
        run: make typecheck

      - name: Security audit
        run: make security

      - name: Run GUT tests
        run: |
          mkdir -p build/test-results
          GUT_JUNIT_XML=build/test-results/gut.xml make test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-test-results
          path: build/test-results
